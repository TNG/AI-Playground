name: Bandit

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
    steps:
      - name: Perform Bandit Analysis
        uses: PyCQA/bandit-action@v1
        with:
          # Scan scope (excluded vendored trees) lives in bandit.yaml so this job and
          # `npm run lint:bandit` check exactly the same files.
          configfile: bandit.yaml
