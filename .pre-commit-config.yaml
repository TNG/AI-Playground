# Pre-commit hooks: formatter + linter for the TS frontend and Python backends.
# Install once with:  pre-commit install
# Run on all files :  pre-commit run --all-files
#
# The first-party Python backends are handled by Ruff (matches the Ruff CI check);
# rule set + version are pinned in ruff.toml. Vendored trees (ComfyUI/, OpenVINO/)
# are excluded there, so the file filter below just enumerates our backend dirs.
# WebUI is handled by ESLint + Prettier via the existing npm scripts (matches the
# "Lint TS" CI check). ESLint resolves its flat config from WebUI/, not the repo
# root, so the eslint hook runs against the whole WebUI workspace.
#
# Formatters (ruff-format, prettier) reformat in place and then `git add` what they
# changed, so they never abort the commit just because formatting was applied — the
# reformatted files are restaged and included in the same commit. The linters still
# fail on genuine, unfixable problems.
#
# Both formatters set `require_serial: true`. Without it pre-commit shards the file
# list across one process per core, and the concurrent `git add`s race for
# `.git/index.lock` — the commit then fails with "Unable to create index.lock" on a
# run where nothing was even reformatted. Serial means one invocation, one `git add`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Linter (auto-fix what it safely can)
      - id: ruff
        name: ruff lint (Python)
        args: [--fix]
        files: ^(service|home-agent|qwen3-tts|backend_shared|comfyui-deps)/.*\.py$

  - repo: local
    hooks:
      # Formatter (Ruff) — format in place, restage, never fail on reformat
      - id: ruff-format
        name: ruff format (Python)
        language: system
        # --force-exclude: pre-commit passes filenames explicitly, and ruff only
        # applies `extend-exclude` from ruff.toml to explicitly-named files when
        # this flag is set. Without it, `pre-commit run --all-files` reformats the
        # vendored qwen3-tts tree that ruff.toml exists to keep untouched. (The
        # upstream ruff lint hook above passes the flag itself.)
        entry: bash -c 'uvx ruff@0.15.20 format --force-exclude "$@" && git add -- "$@"' --
        files: ^(service|home-agent|qwen3-tts|backend_shared|comfyui-deps)/.*\.py$
        require_serial: true
      # Linter (ESLint with auto-fix)
      - id: eslint
        name: eslint (WebUI)
        language: system
        entry: bash -c 'cd WebUI && npm run lint:eslint'
        files: ^WebUI/.*\.(ts|tsx|mts|cts|js|jsx|mjs|cjs|vue)$
        pass_filenames: false
      # Formatter (Prettier) — format in place, restage, never fail on reformat
      - id: prettier
        name: prettier (WebUI)
        language: system
        entry: bash -c 'cd WebUI && files=(); for f in "$@"; do files+=("${f#WebUI/}"); done && npx prettier --write "${files[@]}" && cd .. && git add -- "$@"' --
        files: ^WebUI/.*\.(ts|tsx|mts|cts|js|jsx|mjs|cjs|vue|json|css|scss|html|md|ya?ml)$
        require_serial: true
