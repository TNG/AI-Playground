# Pinned Bandit configuration for AI Playground's Python backends.
#
# Single source of truth for the scan scope: used by .github/workflows/bandit.yml
# (`configfile:`) and by `npm run lint:bandit` in WebUI/package.json — keep the
# two entry points pointing here rather than repeating the list.
#
# Vendored / generated trees we don't own, mirroring `extend-exclude` in ruff.toml
# plus the dependency/output dirs a local run walks into. `qwen3-tts/vendor` is
# upstream qwen-tts model code kept diffable against the wheel (see
# qwen3-tts/vendor/README.md), so its asserts and urlopen calls can't be edited
# away — they are excluded here instead of suppressed file by file.
#
# These are fnmatch globs matched against the full path bandit walks, which is
# prefixed by whatever target it was pointed at (`.` in CI, `..` from WebUI/).
# Hence the leading `*/` — a bare `qwen3-tts/vendor` would match neither.
exclude_dirs:
  - '*/.git/*'
  - '*/.tox/*'
  - '*/.venv/*'
  - '*/__pycache__/*'
  - '*/node_modules/*'
  - '*/ComfyUI/*'
  - '*/OpenVINO/*'
  - '*/build/*'
  - '*/qwen3-tts/vendor/*'
  # Third-party IPEX→CUDA shim (GPL, own LICENSE/README, upstream coding style):
  # its asserts and bare excepts are upstream's, same rationale as the trees above.
  - '*/hijacks/ipex_to_cuda/*'
