[project]
name = "aipg-home-agent"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "Flask",
  # werkzeug 3.1.9: clears CVE-2026-102598. Transitive via Flask.
  "werkzeug>=3.1.9",
  "flask-cors",
  # certifi 2026.10.19: clears GHSA-6q48-6c7w-9gw2 (emSign roots with compromised
  # intermediate CA keys). Transitive via httpx (python-telegram-bot).
  "certifi>=2026.10.19",
  "python-telegram-bot",
  "slack-bolt",
  # aiohttp 3.14.4: clears GHSA-2g87-pp6c-29x5, GHSA-5wr8-gcqf-gqf3 (CVE-2026-111064)
  # and GHSA-494j-54xm-rwp3 (CVE-2026-111063).
  "aiohttp>=3.14.4",
  # multidict 6.9.1: clears CVE-2026-104874. Transitive via aiohttp.
  "multidict>=6.9.1",
  "av",
]
[tool.uv]
python-preference = "only-managed"
link-mode = "clone"
no-build = true
index-strategy = "unsafe-best-match"
required-environments = [
  "sys_platform == 'win32'",
  "sys_platform == 'darwin'",
  "sys_platform == 'linux'",
]
